<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sillage · Twitch, Kick et YouTube sans pub</title>
<meta name="description" content="Sillage réunit tes chaînes Twitch, Kick et YouTube dans une seule app Windows, sans pub. Multistream, agenda esport, notifications de live. Gratuit.">
<meta property="og:title" content="Sillage · Twitch, Kick et YouTube sans pub">
<meta property="og:description" content="Tes chaînes Twitch, Kick et YouTube dans une seule app, sans pub. Gratuit, pour Windows.">
<meta property="og:image" content="https://thorn96.github.io/Sillage-releases/watch.jpg">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root { --bg: #070b14; --panel: #0a1120; --raise: #101a2c; --hover: #13213a; --line: rgba(160,200,255,.09); --text: #eaf2ff; --muted: #8796b0; --accent: #4cc3ff; --live: #ff3b5c }
* { box-sizing: border-box; margin: 0 }
html { scroll-behavior: smooth }
body { background: var(--bg); color: var(--text); font: 16px/1.6 "Segoe UI", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden }
a { color: var(--accent) }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px }
header { display: flex; align-items: center; gap: 12px; padding: 22px 0 }
header img { width: 34px; height: 34px }
header b { font-size: 19px; letter-spacing: -.01em; flex: 1 }
.lang { display: inline-flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--raise) }
.lang button { border: 0; background: none; color: var(--muted); font: 600 13px inherit; padding: 6px 10px; border-radius: 7px; cursor: pointer }
.lang button.on { background: var(--hover); color: var(--text) }

.hero { position: relative; text-align: center; padding: 56px 0 0 }
.hero::before { content: ''; position: absolute; inset: -80px -20% auto; height: 620px; background: radial-gradient(50% 50% at 50% 40%, rgba(28,96,190,.35), transparent 70%); z-index: -1 }
h1 { font-size: clamp(36px, 5.2vw, 64px); line-height: 1.06; letter-spacing: -.03em; font-weight: 800; margin: 0 auto; text-wrap: balance }
@media (min-width: 900px) { h1 { white-space: nowrap } }
h1 span { color: var(--accent) }
.lead { color: var(--muted); font-size: 19px; margin: 22px auto 34px; max-width: 34em }
.cta { display: flex; flex-direction: column; align-items: center; gap: 12px }
.dl { display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 28px; border-radius: 12px; background: var(--accent); color: #061020; font-weight: 700; font-size: 17px; text-decoration: none; transition: box-shadow .2s, transform .2s }
.dl:hover { box-shadow: 0 0 0 6px rgba(76,195,255,.22); transform: translateY(-1px) }
.dl svg { width: 20px; height: 20px }
.meta { color: var(--muted); font-size: 13px }
.platforms { display: flex; gap: 8px; justify-content: center; margin-top: 18px }
.pf { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); font-size: 13px; color: var(--muted) }
.pf i { width: 10px; height: 10px; border-radius: 3px }

/* real screenshots, framed like a window */
.shot { margin: 56px auto 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 40px 100px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4) }
.shot .bar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; background: #060a12; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted) }
.shot .bar img { width: 14px; height: 14px }
.shot > img { display: block; width: 100%; height: auto }

.features { padding: 96px 0 24px; display: flex; flex-direction: column; gap: 96px }
.feature { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center }
.feature:nth-child(even) { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr) }
.feature:nth-child(even) .txt { order: 2 }
.feature .label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent) }
.feature h2 { font-size: 32px; line-height: 1.15; letter-spacing: -.02em; margin: 10px 0 14px }
.feature p { color: var(--muted); font-size: 17px }
.feature .shot { margin: 0; box-shadow: 0 24px 64px rgba(0,0,0,.5) }

.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 72px 0 }
.card { padding: 22px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line) }
.card h3 { font-size: 16px; margin-bottom: 6px }
.card p { color: var(--muted); font-size: 14px }
.steps { padding-bottom: 72px }
.steps h2 { font-size: 28px; margin-bottom: 18px }
.steps ol { padding-left: 20px; color: var(--muted); max-width: 46em }
.steps li { margin-bottom: 10px }
.steps b { color: var(--text) }
.final { text-align: center; padding: 24px 0 88px }
.final h2 { font-size: 34px; letter-spacing: -.02em; margin-bottom: 22px }
footer { border-top: 1px solid var(--line); padding: 28px 0 44px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px }
.bmc { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; background: #ffdd00; color: #0d0c22; font-weight: 700; text-decoration: none; font-size: 14px }
@media (max-width: 900px) { .feature, .feature:nth-child(even) { grid-template-columns: 1fr } .feature:nth-child(even) .txt { order: 0 } .grid { grid-template-columns: 1fr } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.svg" alt="">
    <b>Sillage</b>
    <div class="lang" role="group" aria-label="Langue / Language"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
  </header>

  <section class="hero">
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="cta">
      <a class="dl" href="https://github.com/Thorn96/Sillage-releases/releases/latest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span data-t="dl"></span>
      </a>
      <span class="meta ver" data-t="meta"></span>
    </div>
    <div class="platforms"><span class="pf"><i style="background:#9146ff"></i>Twitch</span><span class="pf"><i style="background:#53fc18"></i>Kick</span><span class="pf"><i style="background:#ff0033"></i>YouTube</span></div>
    <figure class="shot"><div class="bar"><img src="logo.svg" alt="">Sillage</div><img src="watch.jpg" width="1600" height="840" data-alt="altWatch"></figure>
  </section>

  <section class="features">
    <div class="feature">
      <div class="txt"><span class="label" data-t="mLabel"></span><h2 data-t="mTitle"></h2><p data-t="mText"></p></div>
      <figure class="shot"><img src="multi.jpg" width="1600" height="840" loading="lazy" data-alt="altMulti"></figure>
    </div>
    <div class="feature">
      <div class="txt"><span class="label" data-t="aLabel"></span><h2 data-t="aTitle"></h2><p data-t="aText"></p></div>
      <figure class="shot"><img src="agenda.jpg" width="1600" height="840" loading="lazy" data-alt="altAgenda"></figure>
    </div>
  </section>

  <section class="grid">
    <div class="card"><h3 data-t="f1t"></h3><p data-t="f1"></p></div>
    <div class="card"><h3 data-t="f2t"></h3><p data-t="f2"></p></div>
    <div class="card"><h3 data-t="f5t"></h3><p data-t="f5"></p></div>
    <div class="card"><h3 data-t="f6t"></h3><p data-t="f6"></p></div>
    <div class="card"><h3 data-t="f7t"></h3><p data-t="f7"></p></div>
    <div class="card"><h3 data-t="f8t"></h3><p data-t="f8"></p></div>
  </section>

  <section class="steps">
    <h2 data-t="installTitle"></h2>
    <ol><li data-t="s1"></li><li data-t="s2"></li><li data-t="s3"></li></ol>
  </section>

  <section class="final">
    <h2 data-t="finalTitle"></h2>
    <div class="cta">
      <a class="dl" href="https://github.com/Thorn96/Sillage-releases/releases/latest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span data-t="dl"></span>
      </a>
      <span class="meta ver" data-t="meta"></span>
    </div>
  </section>

  <footer>
    <span data-t="foot"></span>
    <a class="bmc" href="https://buymeacoffee.com/leonardguido" target="_blank" rel="noopener">☕ <span data-t="coffee"></span></a>
  </footer>
</div>

<script>
const T = {
  fr: {
    h1: 'Twitch, Kick et YouTube.<br><span>Une seule app. Zéro pub.</span>',
    lead: 'Sillage réunit les chaînes que tu suis sur les trois plateformes dans une seule liste, et lance les streams sans les pubs qui coupent le live.',
    dl: 'Télécharger pour Windows', meta: 'Gratuit · Windows 10 et 11',
    altWatch: "Sillage : la liste des chaînes suivies à gauche, un live Twitch au centre et son chat à droite",
    altMulti: 'Le multistream de Sillage avec quatre lives côte à côte', altAgenda: "L'agenda esport de Sillage : les matchs en cours avec les scores",
    mLabel: 'Multistream', mTitle: "Jusqu'à 4 lives, toutes plateformes mélangées", mText: "Glisse une chaîne depuis ta liste sur la grille, ou sur une case pour la remplacer. Chaque live a son volume et sa qualité ; un clic sur une vidéo pour n'entendre qu'elle.",
    aLabel: 'Agenda', aTitle: 'Les matchs esport du jour, en un clic', aText: "Les matchs en cours avec le score en direct, puis ceux de la journée, filtrables par jeu. Un clic lance le stream officiel. Et un planning de la semaine de tes streamers.",
    f1t: 'Sans pub', f1: 'Les pubs insérées dans les lives Twitch sont évitées, celles de YouTube retirées. Un compteur te montre combien.',
    f2t: 'Une seule liste', f2: 'Tes follows Twitch, Kick et YouTube ensemble, triés par spectateurs ou groupés par jeu, avec favoris et dossiers.',
    f5t: 'Notifications', f5: 'Prévenu quand une chaîne passe en live ou change de jeu, avec la photo du streamer. Heures calmes incluses.',
    f6t: 'Mini-lecteur', f6: 'La fenêtre se réduit dans un coin et reste au premier plan, sans couper le stream.',
    f7t: 'Confort', f7: 'Audio seul, minuteur de sommeil, volume égalisé, VODs et clips, raccourcis clavier, touches média.',
    f8t: 'Discord', f8: 'Affiche « Regarde X sur Sillage » sur ton profil, si tu le veux.',
    installTitle: 'Installation',
    s1: 'Télécharge <b>Sillage-Setup.exe</b> et lance-le.',
    s2: "Windows peut afficher « Windows a protégé votre ordinateur » : l'app n'est pas encore signée. Clique sur <b>Informations complémentaires</b>, puis <b>Exécuter quand même</b>.",
    s3: 'Connecte tes comptes Twitch, Kick et YouTube dans les réglages. Les mises à jour arrivent ensuite toutes seules.',
    finalTitle: 'Regarde tes streams sans les pubs.',
    foot: 'Sillage est gratuit, sans compte ni publicité.', coffee: 'Offrir un café',
  },
  en: {
    h1: 'Twitch, Kick and YouTube.<br><span>One app. Zero ads.</span>',
    lead: 'Sillage brings the channels you follow on all three platforms into one list, and plays streams without the ads that cut the live.',
    dl: 'Download for Windows', meta: 'Free · Windows 10 and 11',
    altWatch: 'Sillage: the followed channels on the left, a Twitch live in the middle and its chat on the right',
    altMulti: "Sillage's multistream with four lives side by side", altAgenda: "Sillage's esports agenda: matches in progress with their scores",
    mLabel: 'Multistream', mTitle: 'Up to 4 lives, any platform', mText: 'Drag a channel from your list onto the grid, or onto a tile to replace it. Each live has its own volume and quality; click a video to hear only it.',
    aLabel: 'Agenda', aTitle: "Today's esports matches, one click away", aText: "Matches in progress with live scores, then the rest of the day, filterable by game. One click plays the official stream. Plus your streamers' schedule for the week.",
    f1t: 'No ads', f1: 'Ads stitched into Twitch lives are avoided and YouTube ads removed. A counter shows how many.',
    f2t: 'One list', f2: 'Your Twitch, Kick and YouTube follows together, sorted by viewers or grouped by game, with favourites and folders.',
    f5t: 'Notifications', f5: 'Know when a channel goes live or switches game, with the streamer’s picture. Quiet hours included.',
    f6t: 'Mini player', f6: 'The window shrinks to a corner and stays on top, without restarting the stream.',
    f7t: 'Comfort', f7: 'Audio only, sleep timer, volume levelling, VODs and clips, keyboard shortcuts, media keys.',
    f8t: 'Discord', f8: 'Shows "Watching X on Sillage" on your profile, if you want.',
    installTitle: 'Install',
    s1: 'Download <b>Sillage-Setup.exe</b> and run it.',
    s2: 'Windows may show "Windows protected your PC": the app is not signed yet. Click <b>More info</b>, then <b>Run anyway</b>.',
    s3: 'Connect your Twitch, Kick and YouTube accounts in settings. Updates then arrive on their own.',
    finalTitle: 'Watch your streams without the ads.',
    foot: 'Sillage is free, with no account and no ads.', coffee: 'Buy me a coffee',
  },
}
let lang = localStorage.getItem('lang') || (navigator.languages.some(l => l.startsWith('fr')) ? 'fr' : 'en')
let version = ''
function apply() {
  document.documentElement.lang = lang
  for (const el of document.querySelectorAll('[data-t]')) el.innerHTML = T[lang][el.dataset.t]
  for (const el of document.querySelectorAll('[data-alt]')) el.alt = T[lang][el.dataset.alt]
  for (const b of document.querySelectorAll('.lang button')) b.classList.toggle('on', b.dataset.l === lang)
  if (version) for (const el of document.querySelectorAll('.ver')) el.textContent = `${T[lang].meta} · v${version}`
}
document.querySelector('.lang').onclick = e => { const b = e.target.closest('[data-l]'); if (b) { lang = b.dataset.l; localStorage.setItem('lang', lang); apply() } }
apply()
// point the buttons straight at the latest installer
fetch('https://api.github.com/repos/Thorn96/Sillage-releases/releases/latest').then(r => r.json()).then(r => {
  const exe = r.assets?.find(a => a.name.endsWith('.exe'))
  if (exe) for (const a of document.querySelectorAll('.dl')) a.href = exe.browser_download_url
  version = r.tag_name?.replace(/^v/, '') ?? ''
  apply()
}).catch(() => {})
</script>
</body>
</html>
